<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Footer Component</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --ftr-bg: #FBF7EE;
    --ftr-border: #EBE0D0;
    --ftr-text: #3A231C;
    --ftr-text-sub: #6E5A51;
    --ftr-accent: #D65B3E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
  }

  /* ============ FOOTER COMPONENT ============ */

  .site-footer-mini {
    background: var(--ftr-bg);
    border-top: 1px solid var(--ftr-border); /* full-width divider */
  }

  .site-footer-mini__row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px 32px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px clamp(20px, 5vw, 64px);
  }

  .site-footer-mini__contact {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .site-footer-mini__label {
    color: var(--ftr-text);
    font-weight: 500;
    font-size: 0.95rem;
  }

  .site-footer-mini__icons {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .site-footer-mini__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--ftr-accent);
    background: transparent;
    color: var(--ftr-accent);
    text-decoration: none;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .site-footer-mini__icon svg {
    width: 16px;
    height: 16px;
  }

  .site-footer-mini__icon:hover,
  .site-footer-mini__icon:focus-visible {
    background: var(--ftr-accent);
    color: var(--ftr-bg);
  }

  .site-footer-mini__icon:focus-visible {
    outline: 2px solid var(--ftr-accent);
    outline-offset: 3px;
  }

  .site-footer-mini__credit {
    margin: 0;
    font-style: italic;
    font-size: 0.8125rem;
    color: var(--ftr-text-sub);
  }

  /* ============ RESPONSIVE ============ */

  @media (max-width: 560px) {
    .site-footer-mini__row {
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      padding-top: 40px;
      padding-bottom: 40px;
    }
  }
</style>
</head>
<body>

  <!-- =========================================================
       MINIMAL FOOTER COMPONENT
       Self-contained: no JS required — mailto: and the GitHub
       link are real <a> tags, so the browser handles both natively.
  ========================================================== -->
  <footer class="site-footer-mini">
    <div class="site-footer-mini__row">
      <div class="site-footer-mini__contact">
        <span class="site-footer-mini__label">Contact</span>
        <div class="site-footer-mini__icons">
          <a class="site-footer-mini__icon" href="mailto:sasiyakorn.chansiri@gmail.com" aria-label="Email Sasiyakorn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="1"></rect>
              <path d="M3 7l9 6 9-6"></path>
            </svg>
          </a>
          <a class="site-footer-mini__icon" href="https://github.com/piingping" target="_blank" rel="noopener" aria-label="GitHub profile">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.84 1.238 1.84 1.238 1.07 1.834 2.807 1.304 3.492.997.108-.775.42-1.305.763-1.605-2.665-.305-5.466-1.334-5.466-5.93 0-1.31.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.014 2.898-.014 3.293 0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
            </svg>
          </a>
        </div>
      </div>

      <p class="site-footer-mini__credit">Designed and developed by Sasiyakorn.</p>
    </div>
  </footer>

</body>
</html>
